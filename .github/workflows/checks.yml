name: Checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HEALTHOPS_UI_FIXTURES: '1'
      HEALTHOPS_AI_PROVIDER: offline
      MLFLOW_DISABLE_TELEMETRY: 'true'
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      GEMINI_API_KEY: ''
      HEALTHOPS_OLLAMA_MODEL: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -c requirements-observability.lock -e '.[dev,observability]'
      - name: Lint and test Python
        run: |
          .venv/bin/python -m ruff check .
          .venv/bin/python -m ruff format --check .
          .venv/bin/python -m pytest -q
      - name: Offline evaluation regression (no provider calls)
        run: .venv/bin/python -m healthops.evaluation --trace --output .local/evaluation
      - name: Install, check, and build dashboard
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run format:check
          npm run build
          npx playwright install --with-deps chromium
      - name: Browser workflows with isolated fixture data
        working-directory: frontend
        run: npm run test:ui

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          mkdir /tmp/healthops-gitleaks
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/healthops-gitleaks gitleaks
      - name: Scan complete Git history
        run: /tmp/healthops-gitleaks/gitleaks git --redact --no-banner .
