[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "healthops-ai"
version = "0.2.0"
description = "Local synthetic clinical-trial screening and human-review prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1"]
observability = ["mlflow==3.15.0", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
healthops = ["static/*", "static/assets/*", "evaluation_cases.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".local", "frontend/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
