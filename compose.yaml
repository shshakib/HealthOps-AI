name: healthops

services:
  synthea:
    profiles: ["data"]
    build:
      context: .
      dockerfile: infrastructure/synthea.Dockerfile
    volumes:
      - ./.local/synthea:/output
    command: ["-p", "5", "-s", "42", "-cs", "42", "-r", "20260901", "-e", "20260901", "-a", "40-75", "--generate.thread_pool_size", "1", "--exporter.baseDirectory", "/output", "--exporter.use_uuid_filenames", "true", "--exporter.fhir.export", "true", "--exporter.fhir.transaction_bundle", "true", "--exporter.fhir.use_us_core_ig", "false", "--exporter.years_of_history", "10", "Massachusetts"]

  postgres:
    # postgres:16-alpine, resolved 2026-09-13.
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: hapi
      POSTGRES_USER: hapi
      # Local synthetic-data development only; no database port is published.
      POSTGRES_PASSWORD: ${FHIR_DB_PASSWORD:-healthops-local-only}
    volumes:
      - fhir_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hapi -d hapi"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  hapi:
    # Official HAPI starter image, resolved 2026-09-13 (immutable digest).
    image: hapiproject/hapi@sha256:d7f38d3676900b07e8a7d3500426eaf8d90ea9ced9a6726416f080f68e230fb0
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hapi
      SPRING_DATASOURCE_USERNAME: hapi
      SPRING_DATASOURCE_PASSWORD: ${FHIR_DB_PASSWORD:-healthops-local-only}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      HIBERNATE_DIALECT: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      HAPI_FHIR_FHIR_VERSION: R4
      SPRING_AI_MCP_SERVER_ENABLED: "false"
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx1536m
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "java", "-Xms16m", "-Xmx64m", "-cp", "/app", "HealthCheck"]
      interval: 20s
      timeout: 10s
      start_period: 180s
      retries: 12
    mem_limit: 2g
    restart: unless-stopped

  healthops:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HEALTHOPS_DB_PATH: /data/healthops.sqlite3
      HEALTHOPS_PUBLIC_URL: http://127.0.0.1:${HEALTHOPS_PORT:-18000}
      # Patient retrieval and explicit source=hapi screenings use this endpoint.
      FHIR_BASE_URL: http://hapi:8080/fhir
      # Empty model keeps the evidence assistant offline. Model selection is explicit.
      HEALTHOPS_OLLAMA_MODEL: ${HEALTHOPS_OLLAMA_MODEL:-}
      HEALTHOPS_OLLAMA_URL: http://host.docker.internal:11434
      HEALTHOPS_AI_PROVIDER: ${HEALTHOPS_AI_PROVIDER:-}
      HEALTHOPS_OPENAI_MODEL: ${HEALTHOPS_OPENAI_MODEL:-}
      HEALTHOPS_ANTHROPIC_MODEL: ${HEALTHOPS_ANTHROPIC_MODEL:-}
      HEALTHOPS_GEMINI_MODEL: ${HEALTHOPS_GEMINI_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${HEALTHOPS_PORT:-18000}:8000"
    volumes:
      - healthops_reviews:/data
    depends_on:
      hapi:
        condition: service_healthy
    restart: unless-stopped

volumes:
  fhir_postgres:
  healthops_reviews:
